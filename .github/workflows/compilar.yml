name: Crear APK Agenda por Voz

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Obtener archivos
        uses: actions/checkout@v4
      - name: Descomprimir proyecto
        run: unzip -q AgendaPorVoz_Android_proyecto.zip -d proyecto
      - name: Usar espejo de Maven Central
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("proyecto/AgendaPorVoz/settings.gradle")
          content = path.read_text()
          mirror = "maven { url 'https://maven-central-eu.storage-download.googleapis.com/maven2/' }"
          content = content.replace("mavenCentral()", mirror + "\n        mavenCentral()")
          path.write_text(content)
          PY
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar SDK Android
        shell: bash
        run: |
          set -e
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          echo "SDK manager: $SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verificar interpretacion de fechas
        working-directory: proyecto/AgendaPorVoz
        run: bash run_parser_tests.sh
      - name: Crear APK
        working-directory: proyecto/AgendaPorVoz
        run: gradle --no-daemon --max-workers=2 assembleDebug
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: AgendaPorVoz-APK
          path: proyecto/AgendaPorVoz/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
